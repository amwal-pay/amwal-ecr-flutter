# ECR SDK dependency mode for the iOS plugin — mirrors android/gradle.properties.
#
# Maps AmwalECR the same way Android maps ecr-sdk:
#   project    — sibling checkout (live sources)
#   cocoapods  — published AmwalECR from CocoaPods trunk
#   spm        — published AmwalECR from GitHub SwiftPM
#
# The example app overrides paths in example/ios/ecr_sdk.properties.
# Apply with: ./tool/sync_ios_ecr_sdk.sh
#
# Paths below are relative to this file's directory (ios/).
ecrSdkDependency=project
ecrSdkVersion=0.2.1
# ecrSdkCocoaPodsRoot=../../AmwalECR-iOS-CocoaPods
# ecrSdkSpmRoot=../../AmwalECR-iOS-SPM
