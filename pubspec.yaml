name: amwal_ecr
description: >-
  Drive an Amwal POS terminal from Flutter. One Dart API over the native
  Android and iOS ECR SDKs: sale, void, refund, inquiry and e-receipt, with
  typed outcomes that keep an unknown result apart from a refusal.
version: 0.2.0
repository: https://github.com/amwal-pay/amwal-ecr-flutter
issue_tracker: https://github.com/amwal-pay/amwal-ecr-flutter/issues
documentation: https://github.com/amwal-pay/amwal-ecr-flutter/tree/main/doc
topics:
  - payments
  - pos
  - ecr
  - terminal

environment:
  sdk: ^3.5.0
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.amwalpay.ecr.flutter
        pluginClass: AmwalEcrPlugin
      ios:
        pluginClass: AmwalEcrPlugin
