# ECR SDK dependency mode for the Android plugin:
#   maven   — com.amwal-pay:ecr-sdk from Maven Central (default for published consumers)
#   project — sibling :ecr-sdk Gradle module (requires example/android gradle.properties too)
#   jar     — pre-built JAR from the ecr_sdk checkout (recommended for Flutter local dev)
#
# Local jar workflow:
#   cd ../../ECR-simulator && ./gradlew :ecr-sdk:jar
#   (paths below assume amwal-ecr-flutter and ecr_sdk are siblings under amwal_pay_apps)
ecrSdkDependency=maven
# ecrSdkRoot=../../ECR-simulator
ecrSdkVersion=1.0.5
# ecrSdkJarPath=../../ECR-simulator/ecr-sdk/build/libs/ecr-sdk-1.0.5.jar
android.useAndroidX=true
