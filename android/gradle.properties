# Default for a published consumer. An app overrides this in its own
# android/gradle.properties (example/ and AmwalECR-flutter-example both do).
#   maven   — com.amwal-pay:ecr-sdk from Maven Central
#   project — sibling :ecr-sdk Gradle module (the app must include it)
#   jar     — pre-built JAR from the ecr_sdk checkout
#
# Local jar workflow:
#   cd ../../ECR-simulator && ./gradlew :ecr-sdk:jar
#   (paths below assume amwal-ecr-flutter and ecr_sdk are siblings under amwal_pay_apps)
ecrSdkDependency=maven
ecrSdkRoot=../../ECR-simulator
ecrSdkVersion=1.0.11
# ecrSdkJarPath=../../ECR-simulator/ecr-sdk/build/libs/ecr-sdk-1.0.8.jar
android.useAndroidX=true
