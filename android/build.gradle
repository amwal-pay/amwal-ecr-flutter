group 'com.amwalpay.ecr.flutter'
version '0.2.1'

def ecrSdkDependency = (findProperty("ecrSdkDependency") ?: "maven").toString().trim()
def ecrSdkVersion = (findProperty("ecrSdkVersion") ?: "1.0.5").toString().trim()
def ecrSdkJarPath = (findProperty("ecrSdkJarPath")
        ?: "../../ECR-simulator/ecr-sdk/build/libs/ecr-sdk-${ecrSdkVersion}.jar").toString().trim()

buildscript {
    ext.kotlin_version = '1.9.24'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        // Lets a pre-release ecr-sdk be tried without publishing it:
        //   ./gradlew :ecr-sdk:publishToMavenLocal   (in an ECR-simulator checkout)
        mavenLocal()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.amwalpay.ecr.flutter'
    compileSdk 34

    // The ECR SDK is a plain JVM library built for Java 17. Desugaring is not
    // involved — nothing in it touches java.time or the newer stream APIs — but
    // the class file version has to be one the toolchain will read.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        // The plugin opens a plain TCP socket on the local network and holds it
        // for up to two minutes. Nothing here needs a newer API than this.
        minSdk 21
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // Switch via android/gradle.properties → ecrSdkDependency=project|jar|maven
    switch (ecrSdkDependency) {
        case "maven":
            println "[amwal_ecr] Using ECR SDK from Maven: com.amwal-pay:ecr-sdk:${ecrSdkVersion}"
            implementation "com.amwal-pay:ecr-sdk:${ecrSdkVersion}"
            break
        case "jar":
            def jarFile = file(ecrSdkJarPath)
            if (!jarFile.exists()) {
                throw new GradleException(
                        "ecr-sdk JAR not found at ${jarFile.absolutePath}. " +
                                "Run './gradlew :ecr-sdk:jar' in the ecr_sdk checkout first.")
            }
            println "[amwal_ecr] Using ECR SDK from JAR: ${jarFile.absolutePath}"
            implementation files(jarFile)
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'
            implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
            break
        case "project":
            println "[amwal_ecr] Using ECR SDK from project module :ecr-sdk"
            implementation project(':ecr-sdk')
            break
        default:
            throw new GradleException(
                    "Unknown ecrSdkDependency='${ecrSdkDependency}'. Use: project | jar | maven")
    }

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    testImplementation "org.jetbrains.kotlin:kotlin-test:$kotlin_version"
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    testImplementation 'junit:junit:4.13.2'
}