# Local ECR SDK. Maven Central has no com.amwal-pay:ecr-sdk:1.0.11, so the
# example builds against the sibling ECR-simulator module.
#   project — :ecr-sdk from ecrSdkRoot
#   maven   — com.amwal-pay:ecr-sdk from Maven Central
#   jar     — a prebuilt JAR (see ecrSdkJarPath)
ecrSdkDependency=project
ecrSdkRoot=../../../ECR-simulator

android.useAndroidX=true
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
